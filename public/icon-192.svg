<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0e1a38"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="2"/>

  <!-- Subtle glow ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Bridge AI Wave Arcs -->
  <path d="M42 126 C 68 84, 124 84, 150 126" fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M56 138 C 76 106, 116 106, 136 138" fill="none" stroke="url(#indigoGrad)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Stylized Signing Hand / Core Node -->
  <circle cx="96" cy="74" r="14" fill="url(#cyanGrad)"/>
  <circle cx="96" cy="74" r="22" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Connecting Nodes -->
  <circle cx="68" cy="100" r="5" fill="#00f2fe"/>
  <circle cx="124" cy="100" r="5" fill="#6366f1"/>
  <line x1="96" y1="74" x2="68" y2="100" stroke="rgba(0, 242, 254, 0.5)" stroke-width="2"/>
  <line x1="96" y1="74" x2="124" y2="100" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2"/>
</svg>
