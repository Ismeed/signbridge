<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0e1a38"/>
    </linearGradient>
    <linearGradient id="cyanGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="indigoGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="4"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- Bridge AI Wave Arcs -->
  <path d="M112 336 C 182 224, 330 224, 400 336" fill="none" stroke="url(#cyanGrad512)" stroke-width="18" stroke-linecap="round"/>
  <path d="M150 368 C 204 282, 308 282, 362 368" fill="none" stroke="url(#indigoGrad512)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Stylized Signing Hand / Core Node -->
  <circle cx="256" cy="198" r="38" fill="url(#cyanGrad512)"/>
  <circle cx="256" cy="198" r="58" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Connecting Nodes -->
  <circle cx="182" cy="268" r="14" fill="#00f2fe"/>
  <circle cx="330" cy="268" r="14" fill="#6366f1"/>
  <line x1="256" y1="198" x2="182" y2="268" stroke="rgba(0, 242, 254, 0.5)" stroke-width="5"/>
  <line x1="256" y1="198" x2="330" y2="268" stroke="rgba(99, 102, 241, 0.5)" stroke-width="5"/>
</svg>
